# Single LCS pod with embedded OGX (library mode). External vLLM via VLLM_URL env.
#
# Requires: ConfigMaps llama-stack-config (run.yaml), lightspeed-stack-config, rag-data, e2e-skills
#
apiVersion: v1
kind: Pod
metadata:
  name: lightspeed-stack-service
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: seed-skills
      image: busybox:latest
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      command:
        - /bin/sh
        - -c
        - |
          set -e
          tar xzf /skills-seed/skills.tgz -C /skills-dest
      volumeMounts:
        - name: skills-seed
          mountPath: /skills-seed
          readOnly: true
        - name: skills
          mountPath: /skills-dest
    - name: setup-rag-data
      image: busybox:latest
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      command:
        - /bin/sh
        - -c
        - |
          set -e
          mkdir -p /rag-work
          if [ -f /rag-data/kv_store.db.gz ]; then
            gunzip -c /rag-data/kv_store.db.gz > /rag-work/kv_store.db
          fi
      volumeMounts:
        - name: rag-data
          mountPath: /rag-data
          readOnly: true
        - name: rag-work
          mountPath: /rag-work
  containers:
    - name: lightspeed-stack-container
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: VLLM_URL
          valueFrom:
            secretKeyRef:
              name: vllm-url-secret
              key: key
        - name: VLLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: vllm-api-key-secret
              key: key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-api-key-secret
              key: key
              optional: true
        - name: FAISS_VECTOR_STORE_ID
          valueFrom:
            secretKeyRef:
              name: faiss-vector-store-secret
              key: id
              optional: true
        - name: KV_RAG_PATH
          value: "/app-root/.e2e-rag-work/kv_store.db"
        - name: VLLM_MODEL
          valueFrom:
            secretKeyRef:
              name: vllm-model-secret
              key: key
              optional: true
        - name: OTEL_SDK_DISABLED
          value: "true"
        - name: OTEL_ANONYMIZATION_SECRET
          value: "lightspeed-stack-otel-anonymization-dev-default"
      image: ${LIGHTSPEED_STACK_IMAGE}
      command: ["/bin/sh", "-c", "mkdir -p /tmp/data && exec /app-root/entrypoint.sh"]
      ports:
        - containerPort: 8080
      readinessProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 45
        periodSeconds: 10
        failureThreshold: 60
      livenessProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 180
        periodSeconds: 30
        failureThreshold: 5
      resources:
        requests:
          cpu: "500m"
          memory: 4Gi
        limits:
          memory: 12Gi
      volumeMounts:
        - name: config
          mountPath: /app-root/lightspeed-stack.yaml
          subPath: lightspeed-stack.yaml
        - name: run-config
          mountPath: /app-root/run.yaml
          subPath: run.yaml
        - name: skills
          mountPath: /app-root/skills
          readOnly: true
        - name: rag-work
          mountPath: /app-root/.e2e-rag-work
        - name: mcp-file-auth-token
          mountPath: /tmp/mcp-token
          subPath: token
          readOnly: true
        - name: mcp-invalid-file-auth-token
          mountPath: /tmp/invalid-mcp-token
          subPath: token
          readOnly: true
  volumes:
    - name: config
      configMap:
        name: lightspeed-stack-config
    - name: run-config
      configMap:
        name: llama-stack-config
    - name: skills-seed
      configMap:
        name: e2e-skills
    - name: skills
      emptyDir: {}
    - name: rag-data
      configMap:
        name: rag-data
    - name: rag-work
      emptyDir: {}
    - name: mcp-file-auth-token
      secret:
        secretName: mcp-file-auth-token
        optional: true
    - name: mcp-invalid-file-auth-token
      secret:
        secretName: mcp-invalid-file-auth-token
        optional: true